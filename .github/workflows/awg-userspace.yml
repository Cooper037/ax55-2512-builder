name: Build AmneziaWG Userspace

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make git golang

      - name: Build amneziawg-go
        run: |
          git clone https://github.com/amnezia-vpn/amneziawg-go.git
          cd amneziawg-go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../amneziawg-go
          cd ..

      - name: Build amneziawg-tools (awg & awg-quick)
        run: |
          git clone https://github.com/amnezia-vpn/amneziawg-tools.git
          cd amneziawg-tools/src
          make CC=aarch64-linux-gnu-gcc LDFLAGS="-static"
          cp wg ../../awg
          cp wg-quick/linux.bash ../../awg-quick
          cd ../..

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-aarch64
          path: |
            amneziawg-go
            awg
            awg-quick
